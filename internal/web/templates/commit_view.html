{{template "header" .}}
{{template "breadcrumb" .Crumbs}}
<h1>{{.Name}} <span class="sha-cell"><code>{{.SHA}}</code><button type="button" class="copy-btn" data-copy="{{.SHA}}" aria-label="Copy commit {{.SHA}} to clipboard">copy</button></span></h1>
<p class="muted">{{.Subject}}</p>
<p class="muted">{{.Author}} &middot; {{.Date}}</p>
<div class="diff-container">
{{template "diff-jump-overlay" .Hunks}}
<pre class="diff">{{range .Rows}}<span class="ln {{.Kind}}"{{if .Anchor}} id="{{.Anchor}}"{{end}}>{{.HTML}}</span>
{{else}}<span class="muted">no changes</span>{{end}}</pre>
</div>
{{template "footer"}}
