\* Conflict-resolution LOSS bug (ConflictHonest = FALSE): a byzantine agent
\* "resolves" an unresolvable mode-160000 gitlink conflict by keeping ONE side
\* and silently dropping the other, then commits it to both anchors. The
\* published merge is a subset of the union of both sides, so TLC finds a state
\* where NoMergeLoss is violated, with the dropped-side counterexample trace.
SPECIFICATION Spec
CONSTANTS
    Artifacts = {a1, a2, a3}
    Fixed = TRUE
    PreReceiveGuard = TRUE
    StagedAtomic = TRUE
    ConflictModel = TRUE
    ConflictHonest = FALSE
    MaxResolveAttempts = 3
INVARIANTS
    TypeOK
    NoMergeLoss
