\* Composed BUGGY protocol -- DoD-CHECK gate off (CheckGated = FALSE), isolating the
\* cross-layer damage of a DoD false-DONE. The durability gate is ON (Gated = TRUE),
\* so the producer dep P's work IS durable + merged -- but P is approved to DONE with
\* its declared acceptance Check UNMET (the jellyfin:zuul-image-build-publish false-
\* DONE, 92d2ed1: config merged but the effect never real). The consumer dependent C
\* observes P at DONE and unlocks on unverified work. NoPrematureUnlock is violated
\* with a trace: the DoD-check gate must ALSO compose across the dependency edge --
\* durable + merged is necessary but NOT sufficient to honestly unlock a dependent.
SPECIFICATION Spec
CONSTANTS
    Gated = TRUE
    CheckGated = FALSE
INVARIANTS
    TypeOK
    NoPrematureUnlock
CHECK_DEADLOCK
    FALSE
