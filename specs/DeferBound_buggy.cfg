\* The bug: no MaxDefers cutoff -- Defer stays enabled forever regardless of
\* the Defers counter, and there is no Escalate edge to fall back to. Because
\* Converge is deliberately unfair (the environment is never assumed to
\* eventually converge), TLC finds a genuine non-terminating behavior: Defer
\* fires forever, Converge never fires, the task livelocks at WAIT and never
\* reaches DONE or HUMAN. Terminates violated, with a counterexample trace.
SPECIFICATION Spec
CONSTANTS
    MaxDefers = 2
    Bounded = FALSE
INVARIANTS
    TypeOK
    NoDoneWhileUnconverged
PROPERTIES
    Terminates
