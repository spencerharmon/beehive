\* The fixed protocol: a true per-field git merge (reconcile publish never
\* clobbers a field it does not own) plus the dedup-skip guard (a superseded
\* reconcile session re-checks the fresh stamp and no-ops instead of
\* redundantly re-publishing). All three invariants hold: a committed status
\* transition survives a concurrent reconcile, an archived task never
\* resurrects, and reconcile never redundantly re-publishes.
SPECIFICATION Spec
CONSTANTS
    RSessions = {1, 2}
    DedupGuard = TRUE
    ThreeWayMerge = TRUE
INVARIANTS
    TypeOK
    NoLostStatus
    NoResurrect
    NoRedundantReconcile
