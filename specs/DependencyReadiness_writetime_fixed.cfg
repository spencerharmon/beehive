\* Fixed write-time protocol: AtomicWrite = TRUE, AtomicLink = TRUE. Two
\* concurrent AddDep writers (w1 proposes b->a, w2 proposes a->b -- jointly a
\* cycle, though neither alone against an empty graph is) each re-validate
\* their cycle verdict ATOMICALLY against the LIVE graph at commit time, so
\* whichever commits second sees the first's edge already written and is
\* refused: no cycle is ever written. LinkSubmodules writes both directions of
\* the one proposed pair in a single atomic step, so no partial/non-reciprocal
\* link is ever observable. NoCycleWritten and ReciprocalLinks hold in every
\* reachable state. No error.
SPECIFICATION Spec
CONSTANTS
    Tasks <- Tasks3
    DepEdges <- EdgesFixed
    DepGuard = TRUE
    CycleGuard = TRUE
    WNodes <- WNodesAB
    Writers <- WritersAB
    ProposedEdge <- RaceEdges
    AtomicWrite = TRUE
    LinkPairs <- LinkPairsOne
    AtomicLink = TRUE
INVARIANTS
    TypeOK
    PhantomNeverHeld
    CycleNeverHeld
    NoCycleWritten
    ReciprocalLinks
PROPERTIES
    EventuallyResolved
