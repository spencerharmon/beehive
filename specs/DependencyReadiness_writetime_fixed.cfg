\* WRITE-TIME FIXED protocol (WriteSpec, AtomicWrite = TRUE): AddDep is cycle-
\* checked (an edge that would close a cycle is refused before it is ever
\* persisted) and LinkSubmodules writes BOTH directions atomically. The persisted
\* dependency graph is acyclic in every reachable state and every link edge is
\* reciprocal -- NoCycleWritten and ReciprocalLinks both hold, no error.
\*
\* The runtime constants (Tasks/DepEdges/DepGuard/CycleGuard) are unused by
\* WriteSpec but must be assigned because they are declared in the module; they
\* are given harmless placeholder values here.
SPECIFICATION WriteSpec
CONSTANTS
    Tasks <- Tasks3
    DepEdges <- EdgesFixed
    DepGuard = TRUE
    CycleGuard = TRUE
    AtomicWrite = TRUE
INVARIANTS
    NoCycleWritten
    ReciprocalLinks
CHECK_DEADLOCK
    FALSE
