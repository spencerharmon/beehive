\* ORPHAN COMPLETION (pre-fix runner): the publish does NOT re-check task presence
\* (`taskRemoved` absent), so a status write lands for a task already removed from
\* main's PLAN. NoOrphanWrite is violated with a counterexample: Remove then
\* PublishUnsafe.
SPECIFICATION Spec
CONSTANTS
    MaxLoops = 3
    Fixed = FALSE
INVARIANTS
    TypeOK
    NoOrphanWrite
