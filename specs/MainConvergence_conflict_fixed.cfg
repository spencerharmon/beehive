\* Conflict-resolution FIXED: the agent resolves a merge conflict to the UNION
\* of both sides and the runner BOUNDS the resolution loop. The resolution
\* always terminates within MaxResolveAttempts and never drops a side, so both
\* conflict-model safety invariants hold (no error).
SPECIFICATION Spec
CONSTANTS
    Artifacts = {a1, a2, a3}
    Fixed = TRUE
    PreReceiveGuard = TRUE
    StagedAtomic = TRUE
    ConflictModel = TRUE
    ConflictHonest = TRUE
    MaxResolveAttempts = 3
INVARIANTS
    TypeOK
    ConflictTerminates
    NoMergeLoss
