\* Keepalive interval at or past the GC reclaim window (K >= TTL): the mid-turn
\* heartbeat restamp lets a live claim's age peak (at K-1) above TTL before it
\* resets, so GC can reclaim a claim whose owning pass is still live -- the
\* duplicate-dispatch class the heartbeat keepalive exists to prevent.
\* NoLiveReclaim is violated, with a counterexample trace.
SPECIFICATION Spec
CONSTANTS
    MaxAge = 8
    K = 6
    TTL = 3
INVARIANTS
    TypeOK
    NoLiveReclaim
