\* Buggy write-time protocol -- WRITE-TIME RACE class: AtomicWrite = FALSE and
\* AtomicLink = FALSE. Two concurrent AddDep writers (w1 proposes b->a, w2
\* proposes a->b) each CheckDep against the SAME pre-write graph (empty) and
\* both get "allow" -- neither edge alone closes a cycle. WriteDep then trusts
\* that STALE verdict instead of re-validating against the live graph, so both
\* commits land: wedges = {b->a, a->b}, a cycle NEITHER call would have
\* permitted if it had rechecked at commit time. NoCycleWritten is violated
\* (safety counterexample) -- the write-time twin of the exact silent wedge
\* CycleNeverHeld forbids at runtime, except here the cycle is WRITTEN in the
\* first place rather than merely existing. LinkSubmodules also writes its one
\* proposed pair's two directions as SEPARATE steps, so the intermediate state
\* with only <<sm1,sm2>> written and <<sm2,sm1>> absent is reachable:
\* ReciprocalLinks is violated too -- the non-reciprocal-link wedge where one
\* submodule sees the link and its peer does not. Deadlock checking is off
\* because both wedges (the written cycle and the non-reciprocal link) ARE the
\* intended defects being reproduced.
SPECIFICATION Spec
CONSTANTS
    Tasks <- Tasks3
    DepEdges <- EdgesFixed
    DepGuard = TRUE
    CycleGuard = TRUE
    WNodes <- WNodesAB
    Writers <- WritersAB
    ProposedEdge <- RaceEdges
    AtomicWrite = FALSE
    LinkPairs <- LinkPairsOne
    AtomicLink = FALSE
INVARIANTS
    TypeOK
    PhantomNeverHeld
    CycleNeverHeld
    NoCycleWritten
    ReciprocalLinks
PROPERTIES
    EventuallyResolved
CHECK_DEADLOCK
    FALSE
