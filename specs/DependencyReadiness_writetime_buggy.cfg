\* WRITE-TIME BUGGY protocol (WriteSpec, AtomicWrite = FALSE): the AddDep cycle
\* check is dropped/raced (AddDepUnchecked persists any candidate edge) and
\* LinkSubmodules writes one direction then the other as two separate steps
\* (LinkOneDir/LinkReverse). Two counterexamples are reachable:
\*   - NoCycleWritten is violated: the candidate edges a->b, b->c, c->a are all
\*     persisted, closing a 3-cycle that AddDep's HasCycle guard would have
\*     refused -- the exact permanent wedge the runtime spec proves is bad, now
\*     written into the registry in the first place.
\*   - ReciprocalLinks is violated: a link is written one direction (a sees the
\*     link to b) while its reverse is not yet present (b does not see a) -- a
\*     non-reciprocal registration is an observable intermediate state.
\* Either invariant fails with a trace. Deadlock checking is off because the
\* wedge/partial-write IS the intended defect.
SPECIFICATION WriteSpec
CONSTANTS
    Tasks <- Tasks3
    DepEdges <- EdgesFixed
    DepGuard = TRUE
    CycleGuard = TRUE
    AtomicWrite = FALSE
INVARIANTS
    NoCycleWritten
    ReciprocalLinks
CHECK_DEADLOCK
    FALSE
