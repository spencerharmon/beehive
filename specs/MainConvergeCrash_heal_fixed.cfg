\* DEFENSE 2 (heal) on the CURRENT ordering: PushFirst=FALSE still transiently
\* forks (local goes ahead in the crash window), but HealOnFork=TRUE lets
\* beehived's reconcile MERGE-heal any detected fork. No committed artifact is
\* ever dropped (NoSilentLoss holds at every state) and the system ALWAYS
\* re-converges (EventuallyConverged), instead of freezing forever as the ff-only
\* pullMain does. This proves the reconcile-heal recovers every reachable fork --
\* including the live pillar fork -- from any source. LocalNeverAhead/Reconcilable
\* are deliberately NOT asserted here: they hold only eventually under this
\* defense, which is exactly what the liveness property certifies.
SPECIFICATION Spec
CONSTANTS
    Artifacts = {a1, a2, a3}
    PushFirst = FALSE
    HealOnFork = TRUE
INVARIANTS
    TypeOK
    NoSilentLoss
PROPERTIES
    EventuallyConverged
