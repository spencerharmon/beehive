\* Keepalive fires strictly faster than the GC reclaim window (K < TTL, with
\* margin): the mid-turn heartbeat restamp always lands before GC's threshold is
\* crossed, so a live claim is never reclaimed, and a dead claim's age keeps
\* growing (capped at MaxAge > TTL) until GC eventually reclaims it.
SPECIFICATION Spec
CONSTANTS
    MaxAge = 8
    K = 2
    TTL = 5
INVARIANTS
    TypeOK
    NoLiveReclaim
PROPERTIES
    EventuallyReclaimDead
