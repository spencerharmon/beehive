\* Conflict-resolution LOOP bug (ConflictHonest = FALSE): a byzantine agent
\* re-attempts the conflicted merge without ever making progress -- the
\* non-terminating resolution loop (swarm.go resolveConflict hands the same
\* conflicted files back forever). resolveAttempts climbs past the runner's
\* MaxResolveAttempts cap, so TLC finds a state where ConflictTerminates is
\* violated, with the loop counterexample trace.
SPECIFICATION Spec
CONSTANTS
    Artifacts = {a1, a2, a3}
    Fixed = TRUE
    PreReceiveGuard = TRUE
    StagedAtomic = TRUE
    ConflictModel = TRUE
    ConflictHonest = FALSE
    MaxResolveAttempts = 3
INVARIANTS
    TypeOK
    ConflictTerminates
