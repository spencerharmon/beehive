\* STARVATION bug (a LIVENESS violation): no weighted-random fairness guarantee
\* (FairSelect = FALSE) -- a ready task can be passed over forever while its peers
\* are selected and requeued (Release). The not_before gate is still honored, so
\* NoPrematureDispatch STILL holds (checked here to show the safety backstop
\* survives); it is EventuallySelected (NoStarvation) that TLC reproduces as a
\* temporal-property violation with a lasso trace where one task is never selected.
SPECIFICATION Spec
CONSTANTS
    Tasks <- Tasks3
    NotBefore <- NBNone
    MaxClock = 2
    FairSelect = FALSE
    GateHonored = TRUE
INVARIANTS
    TypeOK
    NoPrematureDispatch
PROPERTIES
    EventuallySelected
