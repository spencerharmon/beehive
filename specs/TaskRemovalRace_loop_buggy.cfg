\* INFINITE LOOP (pre-fix runner): finding its task's branch/claim vanished, the
\* naive recoverIfLost heuristic misreads it as "lost work" and re-loops the task
\* forever (ReLoopVanished) instead of exiting. VanishedPassTerminates is violated
\* — the pass never reaches "terminated".
SPECIFICATION Spec
CONSTANTS
    MaxLoops = 3
    Fixed = FALSE
INVARIANTS
    TypeOK
PROPERTIES
    VanishedPassTerminates
