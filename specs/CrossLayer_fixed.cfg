\* Composed fixed protocol: BOTH gates on across the dependency edge. The producer
\* dep P reaches DONE only with durable + merged work whose declared DoD Check is
\* satisfied (TaskStatus durability gate + verifyGate inv 5), so the consumer
\* dependent C only ever unlocks on an EARNED DONE. NoPrematureUnlock and
\* ConsumerNeverPhantom hold, and the edge always completes. No error.
SPECIFICATION Spec
CONSTANTS
    Gated = TRUE
    CheckGated = TRUE
INVARIANTS
    TypeOK
    NoPrematureUnlock
    ConsumerNeverPhantom
PROPERTIES
    EventuallyBothDone
