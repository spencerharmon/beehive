\* Buggy: no dedup-skip guard. A second, already-superseded reconcile session
\* never re-checks the fresh ROI stamp before publishing, so it redundantly
\* re-publishes the same already-applied delta -- the "zero-progress
\* reconcile pass" defect (a whole wasted session/turn budget for no ROI
\* progress). NoRedundantReconcile is violated: publishCount reaches 2 for a
\* single ROI delta, with a counterexample trace.
SPECIFICATION Spec
CONSTANTS
    RSessions = {1, 2}
    DedupGuard = FALSE
    ThreeWayMerge = TRUE
INVARIANTS
    TypeOK
    NoRedundantReconcile
