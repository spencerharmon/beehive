\* The ALLOWLIST design (the pre-change bug): admit only commands on a finite
\* positive Allowlist. Here Allowlist = {curl} (a low-risk network tool) but
\* NOT `gotest` -- exactly the friction the old checkpolicy.DefaultAllowedCommands
\* caused: `go test` / `dotnet test` / `pytest` / `nix build` are refused even
\* though opencode permits them and they are the REAL definition of done. The
\* candidate check {gotest} is analyzable, a real framework, opencode-allowed,
\* and not denied -- so RealFrameworkUsable requires it be admitted, but the
\* allowlist refuses it. RealFrameworkUsable violated, with a counterexample.
SPECIFICATION Spec
CONSTANTS
    Commands = {gotest, curl, grep, rm, shutdown}
    RealFramework = {gotest, curl}
    OpencodeAllowed = {gotest, curl, grep, rm}
    Denied = {grep, rm}
    Allowlist = {curl}
    UseDenylist = FALSE
INVARIANTS
    TypeOK
    RealFrameworkUsable
