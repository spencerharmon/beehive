\* Staged-heal FIXED: primary-tree mutation is committed atomically (StagedAtomic
\* = TRUE) -- equivalently, authored in a worktree the dirty-tree heal never
\* touches. No begun write is ever left staged-but-uncommitted, so the
\* HealResetHard reset can eat nothing. All safety invariants hold; NoStagedLoss
\* in particular is never violated. This is the contract the
\* submodule-add-link-protocol-routing Go fix must satisfy.
SPECIFICATION Spec
CONSTANTS
    Artifacts = {a1, a2, a3}
    Fixed = TRUE
    PreReceiveGuard = TRUE
    StagedAtomic = TRUE
INVARIANTS
    TypeOK
    Reconcilable
    NoSilentLoss
    NoStagedLoss
