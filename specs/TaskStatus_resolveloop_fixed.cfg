\* THE FIX for the resolve-attempts loop: the operator Resolve edge
\* NEEDS-HUMAN -> TODO resets Attempts to 0, giving a fresh, bounded rework
\* budget per operator reopen (ResetAttemptsOnResolve = TRUE). ModelResolve ON,
\* so the operator edge is exercised, but the counter can no longer run away
\* across resolve/retry cycles: AttemptsBounded holds across every reachable
\* state, the task still always terminates (DONE or -- within a single cycle's
\* budget -- NEEDS-HUMAN), and every status change is still a legal edge. This
\* pins the fix contract the Go `Resolve` must satisfy. No error.
SPECIFICATION Spec
CONSTANTS
    Limit = 1
    Gated = TRUE
    CheckGated = TRUE
    RevertOverPin = TRUE
    ContentFinalize = TRUE
    ModelResolve = TRUE
    ResetAttemptsOnResolve = TRUE
INVARIANTS
    TypeOK
    LegalTransitionsOnly
    NoFalseDone
    AttemptsBounded
