\* escalates NEEDS-HUMAN instead of deferring forever (swarm.go:2214-2215's
\* defer-cap refusal). Terminates in EVERY behavior regardless of whether the
\* awaited external effect ever converges -- Converge is deliberately unfair
\* (the environment is never assumed to cooperate) yet the task still always
\* reaches DONE or HUMAN via the bounded Escalate edge. No error.
SPECIFICATION Spec
