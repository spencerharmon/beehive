\* Buggy: no gate on the unpublished-plan check. Two sessions can each
\* observe "no PLAN.md yet", each build their own plan, and both publish
\* unconditionally from their stale snapshot -- reproducing a lost/
\* overwritten plan: SinglePlanCreated is violated (both sessions'
\* publishes count) and SecondBootstrapNoOps is violated (the second
\* session's publish clobbers the first session's recorded owner), each
\* with a counterexample trace.
SPECIFICATION Spec
CONSTANTS
    BSessions = {1, 2}
    Gated = FALSE
INVARIANTS
    TypeOK
    SinglePlanCreated
    SecondBootstrapNoOps
