\* Fixed selection: weighted-random over positive weights (FairSelect) AND the
\* not_before gate honored (GateHonored). Two gated/ungated tasks all become ready
\* (t3 at clock 2) and every one is eventually selected -- no starvation -- and none
\* is dispatched before its gate. All invariants hold and the liveness holds. No error.
SPECIFICATION Spec
CONSTANTS
    Tasks <- Tasks3
    NotBefore <- NBGate
    MaxClock = 3
    FairSelect = TRUE
    GateHonored = TRUE
INVARIANTS
    TypeOK
    NoPrematureDispatch
PROPERTIES
    EventuallySelected
