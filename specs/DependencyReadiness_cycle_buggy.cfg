\* Buggy protocol -- CYCLE class: CycleGuard = FALSE, so a task on a dependency
\* cycle is silently HELD (the pre-fix selector merely excludes it from
\* candidates) instead of escalating. t2 <-> t3 depend on each other and can never
\* reach DONE, so both wedge as a masqueraded blocked yield. CycleNeverHeld is
\* violated (safety counterexample) and EventuallyResolved is violated (liveness):
\* the cycle deadlocks silently rather than escalating to NEEDS-HUMAN. Deadlock
\* checking is off because the mutual wedge IS the intended defect.
SPECIFICATION Spec
CONSTANTS
    Tasks <- Tasks3
    DepEdges <- EdgesCycle
    DepGuard = TRUE
    WNodes <- NoWriters
    Writers <- NoWriters
    ProposedEdge <- NoProposedEdge
    AtomicWrite = TRUE
    LinkPairs <- NoLinkPairs
    AtomicLink = TRUE
    CycleGuard = FALSE
INVARIANTS
    TypeOK
    PhantomNeverHeld
    CycleNeverHeld
    NoCycleWritten
    ReciprocalLinks
PROPERTIES
    EventuallyResolved
CHECK_DEADLOCK
    FALSE
