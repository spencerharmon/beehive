\* THE REVIEW-REVERT CONTENT-FINALIZE FIX: the interrupted-review finalize
\* shortcut (FinalizeAlreadyMerged) requires the reviewed CONTENT to actually
\* SURVIVE on the tracked branch (contentPresent) -- not merely that the merge
\* commit is an ANCESTOR (merged) -- AND the declared Check. ContentFinalize =
\* TRUE. A revert-after-merge (RevertMerge: merged/ancestry stays TRUE while
\* contentPresent goes FALSE) can no longer finalize DONE; instead the runner
\* re-opens the reverted merge for rework (ReopenReverted), escalating to
\* NEEDS-HUMAN past Limit. Every DONE gate on. Holds across every reachable
\* state including the full revert trace: NoFalseDone (DONE only with the content
\* present + merged + durable + Check), legal edges only, attempts bounded, and
\* the task still always terminates -- the revert/re-open loop is bounded by the
\* attempts budget, it never livelocks. No error.
SPECIFICATION Spec
CONSTANTS
    Limit = 1
    Gated = TRUE
    CheckGated = TRUE
    RevertOverPin = TRUE
    ContentFinalize = TRUE
    ModelResolve = FALSE
    ResetAttemptsOnResolve = TRUE
INVARIANTS
    TypeOK
    LegalTransitionsOnly
    NoFalseDone
    AttemptsBounded
PROPERTIES
    Terminates
    LostWorkRecovers
