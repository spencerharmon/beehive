\* The fixed protocol: a bootstrap session re-checks the FRESH "PLAN.md
\* exists on main" state immediately before publishing and no-ops if a peer
\* already published (first-publish-wins). This is exactly what
\* TestRunBootstrapGatesOnUnpublishedPlan defends at the Go level today. Both
\* invariants hold: exactly one PLAN.md ever lands, and a second, losing
\* session never clobbers the winner's plan.
SPECIFICATION Spec
CONSTANTS
    BSessions = {1, 2}
    Gated = TRUE
INVARIANTS
    TypeOK
    SinglePlanCreated
    SecondBootstrapNoOps
