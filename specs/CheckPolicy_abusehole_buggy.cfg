\* The ABUSE-HOLE bug: a denylist that OMITS the fake-test tools (here Denied =
\* {rm} only -- `grep` was left out). A honeybee then passes off a bare source-
\* grep as a definition of done: the candidate check {grep} is opencode-allowed
\* and no longer denied, so it is ADMITTED even though it invokes no real
\* framework. NoFakeOnlyAdmitted violated, with the {grep} counterexample --
\* which is exactly why checkpolicy.DefaultDeniedCommands MUST contain the
\* grep/find/test/true anti-abuse group.
SPECIFICATION Spec
CONSTANTS
    Commands = {gotest, curl, grep, rm, shutdown}
    RealFramework = {gotest, curl}
    OpencodeAllowed = {gotest, curl, grep, rm}
    Denied = {rm}
    Allowlist = {curl}
    UseDenylist = TRUE
INVARIANTS
    TypeOK
    NoDeniedAdmitted
    SubsetOpencodeAllowed
    FailClosed
    NoFakeOnlyAdmitted
