\* Buggy protocol -- PHANTOM class (pre-92d2ed1): DepGuard = FALSE, so a blocked
\* yield is accepted even when the blocking dep names NO real task. t3 depends on
\* phantom `ph` (not in Tasks, the dangling cross-link case plan.Plan.DanglingDeps
\* flags) and is silently HELD forever -- it can never progress (the dep can never
\* become DONE). Reproduces flux:phantom-...-repin wedged on
\* jellyfin:jellyfin-image-build. PhantomNeverHeld is violated (safety
\* counterexample) and EventuallyResolved is violated (liveness). Deadlock
\* checking is off because the wedge IS the intended defect.
SPECIFICATION Spec
CONSTANTS
    Tasks <- Tasks3
    DepEdges <- EdgesPhantom
    DepGuard = FALSE
    CycleGuard = TRUE
    AtomicWrite = TRUE
INVARIANTS
    TypeOK
    PhantomNeverHeld
    CycleNeverHeld
PROPERTIES
    EventuallyResolved
CHECK_DEADLOCK
    FALSE
