\* Guarded runner (specs-task-removal-race): the `taskRemoved` re-check gates the
\* publish (PublishSafe disabled once the task vanishes) and a vanished task exits
\* cleanly (TerminateVanished). No orphan write ever lands and every vanished pass
\* terminates.
SPECIFICATION Spec
CONSTANTS
    MaxLoops = 3
    Fixed = TRUE
INVARIANTS
    TypeOK
    NoOrphanWrite
PROPERTIES
    VanishedPassTerminates
