\* Buggy: reconcile publish is a blind whole-file overwrite from its (possibly
\* stale) snapshot instead of a true per-field merge. Reproduces silent lost
\* status flips and resurrected archived tasks: a WorkFlip/ArchiveLean that
\* lands after a reconcile session's snapshot but before its publish is
\* discarded when that session finally publishes. NoLostStatus and NoResurrect
\* are each violated, with a counterexample trace.
SPECIFICATION Spec
CONSTANTS
    RSessions = {1, 2}
    DedupGuard = TRUE
    ThreeWayMerge = FALSE
INVARIANTS
    TypeOK
    NoLostStatus
    NoResurrect
