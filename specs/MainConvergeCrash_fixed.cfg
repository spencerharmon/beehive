\* DEFENSE 1 (reorder): PushFirst=TRUE authors on a staging ref, pushes to the
\* remote FIRST, then fast-forwards local. Local is never set to anything but a
\* subset-or-equal of remote, so no reachable state -- including every crash
\* point and interleaved ExternalPush / ff-only PullMain -- leaves local ahead.
\* All safety invariants hold and the system always converges. HealOnFork=FALSE:
\* the reorder alone needs no fork-healing because no fork is ever reachable.
SPECIFICATION Spec
CONSTANTS
    Artifacts = {a1, a2, a3}
    PushFirst = TRUE
    HealOnFork = FALSE
INVARIANTS
    TypeOK
    LocalNeverAhead
    Reconcilable
    NoSilentLoss
PROPERTIES
    EventuallyConverged
