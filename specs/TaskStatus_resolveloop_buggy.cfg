\* THE RESOLVE-ATTEMPTS LOOP (already-diagnosed, specs/TaskStatus.tla scoped it
\* OUT until now): internal/plan/state.go Resolve moves an escalated task
\* NEEDS-HUMAN -> TODO but does NOT reset Attempts. So a task that escalated at
\* the attempts limit is reopened with its counter still at the limit; one more
\* Reject/RecoverLostWork escalates it again, the operator Resolves again, and
\* across resolve/retry cycles `attempts` grows without bound -- the task loops
\* escalate->resolve->escalate forever. ModelResolve ON (model the operator edge)
\* + ResetAttemptsOnResolve FALSE (Resolve as written -- no reset). Every DONE
\* gate stays ON, isolating the loop from the false-DONE / leak defects. TLC
\* reproduces AttemptsBounded violated with a counterexample trace: the counter
\* climbs past Limit+1. The fix contract (Resolve resets attempts, or attempts
\* become per-cycle) is pinned by TaskStatus_resolveloop_fixed.cfg.
SPECIFICATION Spec
CONSTANTS
    Limit = 1
    Gated = TRUE
    CheckGated = TRUE
    RevertOverPin = TRUE
    ContentFinalize = TRUE
    ModelResolve = TRUE
    ResetAttemptsOnResolve = FALSE
INVARIANTS
    AttemptsBounded
