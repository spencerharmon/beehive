\* THE FIX: revert-over-pin (GateCheck reverts an unearned on-disk terminal
\* back to its pre-handoff status instead of pinning it, escalating to
\* NEEDS-HUMAN past Limit) + runner-owned doc/commit synthesis (Heartbeat only
\* publishes a terminal status -- and synthesizes its doc onto `main`,
\* docOnMain' = TRUE -- once the backing artifacts are actually present).
\* Holds across every reachable state: no terminal status ever leaks to
\* `published` without its change doc also landing on `main`, the handoff
\* itself is never published ahead of durable work, the task still always
\* terminates, and `published` eventually converges with an earned on-disk
\* terminal -- the revert loop never livelocks. No error.
SPECIFICATION Spec
CONSTANTS
    Limit = 1
    Gated = TRUE
    CheckGated = TRUE
    RevertOverPin = TRUE
    ContentFinalize = TRUE
    ModelResolve = FALSE
    ResetAttemptsOnResolve = TRUE
INVARIANTS
    TypeOK
    LegalTransitionsOnly
    NoFalseDone
    NoFalseHandoff
    NoDoclessTerminal
    AttemptsBounded
PROPERTIES
    Terminates
    LostWorkRecovers
    PublishConverges
