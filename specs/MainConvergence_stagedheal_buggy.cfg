\* Staged-heal BUGGY: primary-tree mutation is NON-atomic (StagedAtomic = FALSE)
\* -- MutatePrimaryTree stages a write into the live primary working tree but
\* does not commit it. Convergent authoring and the pre-receive guard are BOTH
\* on, so neither the fork (Reconcilable) nor the force-rewind (NoSilentLoss)
\* seams fire; the ONLY reachable defect is the dirty-tree heal eating an
\* in-flight write. TLC finds a state where HealResetHard runs between
\* MutatePrimaryTree and CommitStaged, dropping the begun artifact from the
\* staged view and both anchors -> NoStagedLoss is violated, with the
\* counterexample trace. This is the 2026-07-29 submodule-add orphan-gitlink
\* loss made checkable.
SPECIFICATION Spec
CONSTANTS
    Artifacts = {a1, a2, a3}
    Fixed = TRUE
    PreReceiveGuard = TRUE
    StagedAtomic = FALSE
    ConflictModel = FALSE
    ConflictHonest = TRUE
    MaxResolveAttempts = 3
INVARIANTS
    TypeOK
    NoStagedLoss
