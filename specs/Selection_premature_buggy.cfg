\* PREMATURE-DISPATCH bug (a SAFETY violation): the not_before gate is IGNORED
\* (GateHonored = FALSE), so t3 -- whose not_before is clock 2 -- can be selected
\* at clock 0, before its wall clock arrives. NoPrematureDispatch is violated with
\* a counterexample trace (badPick flips TRUE on the early Select). FairSelect is
\* TRUE here so this cfg isolates the gate failure from starvation.
SPECIFICATION Spec
CONSTANTS
    Tasks <- Tasks3
    NotBefore <- NBGate
    MaxClock = 3
    FairSelect = TRUE
    GateHonored = FALSE
INVARIANTS
    TypeOK
    NoPrematureDispatch
