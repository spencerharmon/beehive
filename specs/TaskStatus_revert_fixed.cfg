\* THE FIX: content/Check-gated finalize. The already-merged review shortcut
\* (FinalizeAlreadyMerged) requires the reviewed TREE CONTENT to be PRESENT on
\* `main` (artifactOnMain), not merely that the merge commit is an ANCESTOR --
\* since the runner re-runs the task's Check on the merged tree before pushing,
\* content-present is the effect the Check asserts. A revert-after-merge (the merge
\* stays an ancestor while the files are deleted) therefore REFUSES DONE; the task
\* instead re-earns DONE through a fresh review approve that re-lands the content
\* (or terminates NEEDS-HUMAN past Limit). ModelRevert enables the same
\* interrupted-merge + revert adversary as the buggy cfg; ContentGated = TRUE closes
\* it. NoFalseDone holds across every reachable state including the revert trace,
\* the status machine stays legal, attempts stay bounded, the task always
\* terminates, and lost work never strands. No error.
SPECIFICATION Spec
CONSTANTS
    Limit = 1
    Gated = TRUE
    CheckGated = TRUE
    RevertOverPin = TRUE
    ModelResolve = FALSE
    ResetAttemptsOnResolve = TRUE
    ModelRevert = TRUE
    ContentGated = TRUE
INVARIANTS
    TypeOK
    LegalTransitionsOnly
    NoFalseDone
    AttemptsBounded
PROPERTIES
    Terminates
    LostWorkRecovers
