\* Composed BUGGY protocol -- DURABILITY gate off (Gated = FALSE), isolating the
\* cross-layer damage of a NON-DURABLE false-DONE. The producer dep P hands off and
\* is approved to DONE without its work being durable-on-origin/merged (the pre-
\* 72e2b4a false-DONE). The consumer dependent C observes P at DONE and unlocks --
\* building on phantom upstream work. NoPrematureUnlock is violated with a trace:
\* the durability gate must hold ACROSS the dependency edge, not just on P alone.
SPECIFICATION Spec
CONSTANTS
    Gated = FALSE
    CheckGated = TRUE
INVARIANTS
    TypeOK
    NoPrematureUnlock
    ConsumerNeverPhantom
CHECK_DEADLOCK
    FALSE
