\* Graph: t1 (no deps) -> DONE; t2 depends on real t1 -> HELD then DONE; t3
\* depends on phantom `ph` (not in Tasks) -> NEEDS-HUMAN; t4<->t5 form a cycle ->
\* both NEEDS-HUMAN. All invariants hold and every task resolves. No error.
