\* The DENYLIST design (the fix). The denylist contains BOTH the anti-abuse
\* fake-test tools (grep) and the code-smuggling/destructive backstop (rm) --
\* the two groups of checkpolicy.DefaultDeniedCommands. opencode permits all
\* commands EXCEPT the host-power tool `shutdown` (its own permission config).
\* Admissible = OpencodeAllowed \ Denied = {gotest, curl}. A real-framework
\* check is admitted with no positive allowlist; every safety property holds.
\* No error.
SPECIFICATION Spec
CONSTANTS
    Commands = {gotest, curl, grep, rm, shutdown}
    RealFramework = {gotest, curl}
    OpencodeAllowed = {gotest, curl, grep, rm}
    Denied = {grep, rm}
    Allowlist = {curl}
    UseDenylist = TRUE
INVARIANTS
    TypeOK
    NoDeniedAdmitted
    SubsetOpencodeAllowed
    FailClosed
    NoFakeOnlyAdmitted
    RealFrameworkUsable
